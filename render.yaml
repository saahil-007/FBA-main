services:
  # Backend Service (Docker with venv)
  - type: web
    name: fba-backend
    env: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

  # Frontend Service (Static Site)
  - type: static_site
    name: fba-frontend
    rootDir: frontend
    publishDir: dist
    buildCommand: npm install && npm run build
    envVars:
      - key: VITE_API_URL
        sync: false # User will provide the backend URL after it's created
